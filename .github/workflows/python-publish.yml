# This workflow uploads a Python package to PyPI when a GitHub Release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install setuptools for version check
        run: python -m pip install --upgrade pip setuptools

      - name: Verify release tag matches package version
        shell: bash
        run: |
          VERSION="$(python setup.py --version)"
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" != "$VERSION" && "$TAG" != "v$VERSION" ]]; then
            echo "Release tag '$TAG' does not match package version '$VERSION'."
            exit 1
          fi

      - name: Install package and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install --upgrade build twine pytest

      - name: Run test suite
        run: |
          pytest -q tests
          python scripts/run_smoke_checks.py

      - name: Build and validate release distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi
      url: https://pypi.org/project/mesa-cfdna/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
